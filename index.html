<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brújula Literaria | Descubre tu próxima lectura</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-warm: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(15, 23, 42, 0.85);
      --btn-hover: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .app-card {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-banner {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: inline-block;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .progress-wrapper {
      margin-bottom: 28px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      width: 16%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .question-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choice {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-choice:hover {
      border-color: var(--accent);
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
    }

    .btn-choice .opt-icon {
      font-size: 1.4rem;
      min-width: 32px;
      text-align: center;
    }

    .result-section {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .tag-alt {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-warm);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .book-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .book-author {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      font-style: italic;
    }

    .passage-card {
      background: rgba(15, 23, 42, 0.9);
      border-left: 4px solid var(--accent);
      border-radius: 0 14px 14px 0;
      padding: 18px 20px;
      text-align: left;
      font-size: 0.96rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .why-block {
      text-align: left;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%);
      color: #0f172a;
      font-weight: 700;
      padding: 15px 22px;
      border-radius: 14px;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-warm);
      color: var(--accent-warm);
      background: rgba(245, 158, 11, 0.08);
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
      text-decoration: underline;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <span class="icon-banner">🧭</span>
      <h1>Brújula de Lectura</h1>
      <p id="subHeader">Cargando biblioteca...</p>
    </div>

    <div class="progress-wrapper" id="progressWrapper" style="display:none;">
      <div class="progress-meta">
        <span id="stepIndicator">Pregunta 1 de 6</span>
        <span id="stepPercent">16%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div id="quizBox">
      <div id="loadingBox" class="status-msg">Cargando base de datos de libros...</div>
      <h2 class="question-title" id="questionTitle" style="display:none;"></h2>
      <div class="options-list" id="optionsList"></div>
    </div>

    <div class="result-section" id="resultBox">
      <div class="result-badges">
        <span class="tag-badge" id="resCategory">Recomendación</span>
        <span class="tag-badge tag-alt" id="resCounter">Opción 1 de 10</span>
      </div>
      
      <h2 class="book-title" id="resTitle">Título del Libro</h2>
      <p class="book-author" id="resAuthor">por Autor</p>
      
      <div class="passage-card">
        <p id="resPassage">"Pasaje del libro..."</p>
      </div>

      <div class="why-block">
        <strong style="color: #f1f5f9; display:block; margin-bottom:4px;">¿Por qué este libro?</strong>
        <span id="resReason">Razón de la recomendación.</span>
      </div>

      <div class="action-group">
        <a href="#" target="_blank" class="btn-main" id="resLink">
          <span>📖 Ver en Google Play Libros</span>
          <span>↗</span>
        </a>
        <button class="btn-secondary" id="btnNextOption" onclick="showNextOption()">
          🔄 No me convence, ver otra opción
        </button>
        <button class="btn-reset" onclick="restartQuiz()">Reiniciar cuestionario</button>
      </div>
    </div>
  </div>

  <script>
    let booksCatalog = [];

    const surveyQuestions = [
      {
        key: "age",
        title: "¿En qué rango de edad te encuentras?",
        options: [
          { icon: "🌱", label: "De 5 a 11 años (Primeras lecturas)", value: "5-11" },
          { icon: "⚡", label: "De 12 a 17 años (Jóvenes)", value: "12-17" },
          { icon: "☕", label: "18 años o más (Jóvenes y adultos)", value: "18+" }
        ]
      },
      {
        key: "pace",
        title: "¿Cuál es tu ritmo de lectura habitual?",
        options: [
          { icon: "🐢", label: "Apenas empiezo / Me canso rápido", value: "principiante" },
          { icon: "🚶", label: "Lector casual (historias ágiles y entretenidas)", value: "casual" },
          { icon: "🚀", label: "Devorador de libros (tramas densas o complejas)", value: "avido" }
        ]
      },
      {
        key: "vibe",
        title: "¿Qué sensación buscas sentir hoy?",
        options: [
          { icon: "🔥", label: "Adrenalina, tensión y aventura trepidante", value: "aventurero" },
          { icon: "🧩", label: "Intriga, secretos y ganas de resolver algo", value: "misterioso" },
          { icon: "💡", label: "Reflexión profunda, filosofía o inspiración", value: "reflexivo" },
          { icon: "🎭", label: "Risas, buen humor o drama cotidiano", value: "divertido" }
        ]
      },
      {
        key: "genre",
        title: "¿Qué tipo de género literario prefieres explorar?",
        options: [
          { icon: "⚔️", label: "Aventura o Fantasía con magia y nuevos mundos", value: "fantasia" },
          { icon: "🕵️", label: "Misterio policial, enigmas y suspenso", value: "misterio" },
          { icon: "🤖", label: "Ciencia ficción, futuros extraños y distopías", value: "scifi" },
          { icon: "📜", label: "Historias reales, leyendas o realismo mágico", value: "leyendas" },
          { icon: "🌱", label: "Vida cotidiana, humor o desarrollo personal", value: "crecimiento" }
        ]
      },
      {
        key: "protagonist",
        title: "¿Quién te gustaría que sea el protagonista?",
        options: [
          { icon: "🛡️", label: "Un héroe solitario contra el mundo o su destino", value: "solitario" },
          { icon: "🤝", label: "Un grupo leal de amigos o una familia unida", value: "amigos" },
          { icon: "🐉", label: "Criaturas míticas, animales o seres fantásticos", value: "criaturas" }
        ]
      },
      {
        key: "format",
        title: "¿Qué extensión prefieres para este momento?",
        options: [
          { icon: "⚡", label: "Corto y al grano (menos de 150 páginas / cuentos)", value: "corto" },
          { icon: "📖", label: "Longitud media (la medida ideal para disfrutar)", value: "medio" },
          { icon: "📚", label: "Novela extensa o saga con un mundo enorme", value: "largo" }
        ]
      }
    ];

    let currentStep = 0;
    const userAnswers = {};
    let rankedRecommendations = [];
    let currentRecIndex = 0;

    // Cargar la base de datos externa de libros
    async function loadCatalog() {
      try {
        const response = await fetch('./libros.json');
        if (!response.ok) throw new Error("No se pudo cargar libros.json");
        booksCatalog = await response.json();
        
        document.getElementById("loadingBox").style.display = "none";
        document.getElementById("questionTitle").style.display = "block";
        document.getElementById("progressWrapper").style.display = "block";
        document.getElementById("subHeader").textContent = `${booksCatalog.length} obras en catálogo`;
        renderQuestion();
      } catch (err) {
        document.getElementById("loadingBox").innerHTML = `
          <p style="color:#f87171;">⚠️ No se encontró el archivo <code>libros.json</code>.</p>
          <p style="font-size:0.85rem; margin-top:8px;">Asegúrate de colocar <b>libros.json</b> en la misma carpeta que este <b>index.html</b> en tu repositorio.</p>
        `;
      }
    }

    function renderQuestion() {
      const q = surveyQuestions[currentStep];
      document.getElementById("questionTitle").textContent = q.title;

      const progressPercent = Math.round(((currentStep + 1) / surveyQuestions.length) * 100);
      document.getElementById("progressFill").style.width = progressPercent + "%";
      document.getElementById("stepIndicator").textContent = `Pregunta ${currentStep + 1} de ${surveyQuestions.length}`;
      document.getElementById("stepPercent").textContent = progressPercent + "%";

      const list = document.getElementById("optionsList");
      list.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-choice";
        btn.innerHTML = `<span class="opt-icon">${opt.icon}</span> <span>${opt.label}</span>`;
        btn.onclick = () => selectOption(q.key, opt.value);
        list.appendChild(btn);
      });
    }

    function selectOption(key, val) {
      userAnswers[key] = val;
      currentStep++;

      if (currentStep < surveyQuestions.length) {
        renderQuestion();
      } else {
        calculateRecommendations();
      }
    }

    function calculateRecommendations() {
      rankedRecommendations = booksCatalog.map(b => {
        let score = 0;
        if (b.ages && b.ages.includes(userAnswers.age)) score += 5;
        if (b.pace && b.pace.includes(userAnswers.pace)) score += 3;
        if (b.vibe && b.vibe.includes(userAnswers.vibe)) score += 3;
        if (b.genre === userAnswers.genre) score += 4;
        if (b.protagonist === userAnswers.protagonist) score += 2;
        if (b.format && b.format.includes(userAnswers.format)) score += 2;

        return { ...b, matchScore: score };
      });

      rankedRecommendations.sort((a, b) => b.matchScore - a.matchScore);
      rankedRecommendations = rankedRecommendations.slice(0, 15);

      currentRecIndex = 0;
      document.getElementById("quizBox").style.display = "none";
      document.getElementById("progressWrapper").style.display = "none";
      document.getElementById("resultBox").style.display = "block";

      displayCurrentRecommendation();
    }

    function displayCurrentRecommendation() {
      const book = rankedRecommendations[currentRecIndex];

      document.getElementById("resCategory").textContent = book.category || "Literatura Recomendada";
      document.getElementById("resCounter").textContent = `Opción ${currentRecIndex + 1} de ${rankedRecommendations.length}`;
      document.getElementById("resTitle").textContent = book.title;
      document.getElementById("resAuthor").textContent = `por ${book.author}`;
      document.getElementById("resPassage").textContent = `"${book.passage || 'Una obra indispensable para descubrir nuevas perspectivas.'}"`;
      document.getElementById("resReason").textContent = book.reason || "Coincide con tus preferencias de género y ritmo de lectura.";
      
      const querySearch = encodeURIComponent(`${book.title} ${book.author}`);
      document.getElementById("resLink").href = `https://play.google.com/store/search?q=${querySearch}&c=books`;

      const btnNext = document.getElementById("btnNextOption");
      if (currentRecIndex >= rankedRecommendations.length - 1) {
        btnNext.textContent = "🔄 Volver a la primera recomendación";
      } else {
        btnNext.textContent = "🔄 No me convence, ver otra opción";
      }
    }

    function showNextOption() {
      currentRecIndex = (currentRecIndex + 1) % rankedRecommendations.length;
      displayCurrentRecommendation();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartQuiz() {
      currentStep = 0;
      currentRecIndex = 0;
      for (let k in userAnswers) delete userAnswers[k];
      rankedRecommendations = [];

      document.getElementById("quizBox").style.display = "block";
      document.getElementById("progressWrapper").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      renderQuestion();
    }

    loadCatalog();
  </script>
</body>
</html>
