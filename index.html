<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brújula de Lectura | Descubre tu próxima lectura</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-warm: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(15, 23, 42, 0.85);
      --btn-hover: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .app-card {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-banner {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: inline-block;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .progress-wrapper {
      margin-bottom: 28px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      width: 16%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .question-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choice {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-choice:hover {
      border-color: var(--accent);
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
    }

    .btn-choice .opt-icon {
      font-size: 1.4rem;
      min-width: 32px;
      text-align: center;
    }

    .result-section {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .tag-alt {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-warm);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .book-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .book-author {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      font-style: italic;
    }

    .passage-card {
      background: rgba(15, 23, 42, 0.9);
      border-left: 4px solid var(--accent);
      border-radius: 0 14px 14px 0;
      padding: 18px 20px;
      text-align: left;
      font-size: 0.96rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .why-block {
      text-align: left;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%);
      color: #0f172a;
      font-weight: 700;
      padding: 15px 22px;
      border-radius: 14px;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-warm);
      color: var(--accent-warm);
      background: rgba(245, 158, 11, 0.08);
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <span class="icon-banner">🧭</span>
      <h1>Brújula de Lectura</h1>
      <p>por Robert Pacheco</p>
    </div>

    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-meta">
        <span id="stepIndicator">Pregunta 1 de 6</span>
        <span id="stepPercent">16%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div id="quizBox">
      <h2 class="question-title" id="questionTitle"></h2>
      <div class="options-list" id="optionsList"></div>
    </div>

    <div class="result-section" id="resultBox">
      <div class="result-badges">
        <span class="tag-badge" id="resCategory">Recomendación</span>
        <span class="tag-badge tag-alt" id="resCounter">Opción 1 de 20</span>
      </div>
      
      <h2 class="book-title" id="resTitle">Título del Libro</h2>
      <p class="book-author" id="resAuthor">por Autor</p>
      
      <div class="passage-card">
        <p id="resPassage">"Pasaje del libro..."</p>
      </div>

      <div class="why-block">
        <strong style="color: #f1f5f9; display:block; margin-bottom:4px;">¿Por qué este libro?</strong>
        <span id="resReason">Razón de la recomendación.</span>
      </div>

      <div class="action-group">
        <a href="#" target="_blank" class="btn-main" id="resLink">
          <span>📖 Ver en Google Play Libros</span>
          <span>↗</span>
        </a>
        <button class="btn-secondary" id="btnNextOption" onclick="showNextOption()">
          🔄 No me convence, ver otra opción
        </button>
        <button class="btn-reset" onclick="restartQuiz()">Reiniciar cuestionario</button>
      </div>
    </div>
  </div>

  <script>
    // Catálogo maestro integrado de 100 obras reales y clasificadas estrictamente por edad
    const booksCatalog = [
      // --- INFANTILES Y JUVENILES (5-11 y 12-17) ---
      { id: "b_01", title: "Cuentos de la selva", author: "Horacio Quiroga", ages: ["5-11", "12-17"], pace: ["principiante", "casual"], vibe: ["aventurero"], genre: "aventura", protagonist: "criaturas", format: ["corto"], passage: "Los yacarés se despertaron de golpe con un gran ruido en el agua...", reason: "Relatos ágiles llenos de naturaleza y animales ingeniosos.", category: "Clásico Latinoamericano" },
      { id: "b_02", title: "El principito", author: "Antoine de Saint-Exupéry", ages: ["5-11", "12-17"], pace: ["principiante", "casual"], vibe: ["reflexivo"], genre: "crecimiento", protagonist: "solitario", format: ["corto"], passage: "Sólo con el corazón se puede ver bien; lo esencial es invisible para los ojos.", reason: "Una joya poética universal sobre la amistad.", category: "Clásico Universal" },
      { id: "b_03", title: "Las preguntas de Aldebarán", author: "Robert Pacheco", ages: ["5-11", "12-17"], pace: ["principiante", "casual"], vibe: ["reflexivo", "divertido"], genre: "crecimiento", protagonist: "amigos", format: ["corto"], passage: "Cuando miras hacia arriba, no solo hay estrellas: hay respuestas esperando.", reason: "Ideal para mentes inquietas que buscan respuestas a las grandes dudas.", category: "Educativo e Inspirador" },
      { id: "b_04", title: "Harry Potter y la piedra filosofal", author: "J.K. Rowling", ages: ["5-11", "12-17"], pace: ["casual", "avido"], vibe: ["aventurero", "misterioso"], genre: "fantasia", protagonist: "amigos", format: ["medio", "largo"], passage: "El señor y la señora Dursley estaban orgullosos de ser normales...", reason: "La entrada definitiva a un universo de magia.", category: "Pop & Fantasía" },
      { id: "b_05", title: "Charlie y la fábrica de chocolate", author: "Roald Dahl", ages: ["5-11", "12-17"], pace: ["principiante", "casual"], vibe: ["divertido"], genre: "fantasia", protagonist: "solitario", format: ["corto", "medio"], passage: "¡El billete dorado brillaba con una luz hermosa!", reason: "Humor y dulces fantásticos para disfrutar sin parar.", category: "Clásico Infantil" },
      { id: "b_06", title: "Percy Jackson y el ladrón del rayo", author: "Rick Riordan", ages: ["12-17"], pace: ["casual", "avido"], vibe: ["aventurero"], genre: "fantasia", protagonist: "amigos", format: ["medio", "largo"], passage: "Mira, yo no quería ser un mestizo...", reason: "Mitología griega adaptada a un ritmo vertiginoso.", category: "Pop & Aventura" },
      { id: "b_07", title: "Los juegos del hambre", author: "Suzanne Collins", ages: ["12-17"], pace: ["casual", "avido"], vibe: ["aventurero"], genre: "scifi", protagonist: "solitario", format: ["medio", "largo"], passage: "—¡Me ofrezco voluntaria como tributo!", reason: "Suspenso constante y tensión desde el primer capítulo.", category: "Distopía Pop" },
      { id: "b_08", title: "101 buenos malos consejos para mi hijo", author: "Robert Pacheco", ages: ["12-17", "18+"], pace: ["principiante", "casual"], vibe: ["divertido", "reflexivo"], genre: "crecimiento", protagonist: "amigos", format: ["corto", "medio"], passage: "Aprender a tropezar con estilo es mucho más valioso.", reason: "Sentido del humor mordaz y consejos prácticos.", category: "Humor y Crecimiento" },
      { id: "b_09", title: "El libro salvaje", author: "Juan Villoro", ages: ["12-17"], pace: ["casual", "avido"], vibe: ["misterioso", "aventurero"], genre: "aventura", protagonist: "solitario", format: ["medio"], passage: "Los libros son como espejos: sólo se ve en ellos lo que uno ya lleva dentro.", reason: "Una biblioteca laberíntica con misterios familiares.", category: "Literatura Mexicana" },
      { id: "b_10", title: "La peor señora del mundo", author: "Francisco Hinojosa", ages: ["5-11"], pace: ["principiante", "casual"], vibe: ["divertido"], genre: "crecimiento", protagonist: "amigos", format: ["corto"], passage: "En el norte de Turambul había una señora que era la peor...", reason: "Demuestra que el ingenio vence a la tiranía.", category: "Literatura Mexicana" },
      { id: "b_11", title: "Momo", author: "Michael Ende", ages: ["5-11", "12-17"], pace: ["casual", "avido"], vibe: ["reflexivo"], genre: "fantasia", protagonist: "solitario", format: ["medio"], passage: "El tiempo es vida. Y la vida reside en el corazón.", reason: "Una niña valiente que se enfrenta a quienes roban el tiempo.", category: "Clásico Universal" },
      { id: "b_12", title: "Matilda", author: "Roald Dahl", ages: ["5-11", "12-17"], pace: ["principiante", "casual"], vibe: ["divertido"], genre: "crecimiento", protagonist: "solitario", format: ["medio"], passage: "Los libros la transportaban a nuevos mundos.", reason: "Una niña brillante amante de los libros.", category: "Clásico Infantil" },
      { id: "b_13", title: "El hobbit", author: "J.R.R. Tolkien", ages: ["12-17"], pace: ["casual", "avido"], vibe: ["aventurero"], genre: "fantasia", protagonist: "solitario", format: ["medio", "largo"], passage: "En un agujero en el suelo vivía un hobbit.", reason: "El viaje iniciático por excelencia con dragones y anillos.", category: "Fantasía Épica" },
      { id: "b_14", title: "Las batallas en el desierto", author: "José Emilio Pacheco", ages: ["12-17", "18+"], pace: ["principiante", "casual"], vibe: ["reflexivo"], genre: "crecimiento", protagonist: "solitario", format: ["corto"], passage: "Me enamoré de Mariana sabiendo que era un amor imposible.", reason: "La nostalgia del México de mediados del siglo XX.", category: "Clásico Mexicano" },
      { id: "b_15", title: "El caballero de la armadura oxidada", author: "Robert Fisher", ages: ["12-17", "18+"], pace: ["principiante"], vibe: ["reflexivo"], genre: "crecimiento", protagonist: "solitario", format: ["corto"], passage: "El caballero pensaba que era bueno, generoso y amoroso.", reason: "Relato sobre desprenderse de las corazas emocionales.", category: "Crecimiento y Reflexión" },

      // --- OSCAR WILDE (12-17 y 18+) ---
      { id: "b_16", title: "El retrato de Dorian Gray", author: "Oscar Wilde", ages: ["12-17", "18+"], pace: ["casual", "avido"], vibe: ["misterioso", "reflexivo"], genre: "misterio", protagonist: "solitario", format: ["medio"], passage: "La única forma de librarse de la tentación es caer en ella.", reason: "Reflexión profunda sobre la belleza y la vanidad.", category: "Clásico Universal" },
      { id: "b_17", title: "El fantasma de Canterville", author: "Oscar Wilde", ages: ["12-17", "18+"], pace: ["principiante", "casual"], vibe: ["divertido"], genre: "misterio", protagonist: "amigos", format: ["corto"], passage: "Cuando los Otis compraron Canterville Chase...", reason: "Divertida sátira sobre un viejo fantasma.", category: "Clásico Universal" },
      { id: "b_18", title: "El príncipe feliz y otros cuentos", author: "Oscar Wilde", ages: ["12-17", "18+"], pace: ["principiante", "casual"], vibe: ["reflexivo"], genre: "crecimiento", protagonist: "solitario", format: ["corto"], passage: "—¿Quién eres tú? —dijo—. Soy el Príncipe Feliz.", reason: "Cuentos tiernos y conmovedores llenos de altruismo.", category: "Clásico Universal" },
      { id: "b_19", title: "El crimen de Lord Arthur Savile", author: "Oscar Wilde", ages: ["18+"], pace: ["casual"], vibe: ["divertido", "misterioso"], genre: "misterio", protagonist: "solitario", format: ["corto"], passage: "Lord Arthur Savile experimentó un sobresalto espantoso.", reason: "Ironía fina y humor negro victoriano.", category: "Clásico Universal" },

      // --- STEPHEN KING (Estrictamente Adultos 18+) ---
      { id: "b_20", title: "Carrie", author: "Stephen King", ages: ["18+"], pace: ["casual", "avido"], vibe: ["oscuro"], genre: "misterio", protagonist: "solitario", format: ["medio"], passage: "Las chicas con poderes telequinéticos no suelen tener una adolescencia sencilla.", reason: "La obra que lanzó a la fama al maestro del terror.", category: "Terror & Suspenso" },
      { id: "b_21", title: "El resplandor", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["misterioso", "oscuro"], genre: "misterio", protagonist: "solitario", format: ["largo"], passage: "El hotel Overlook guardaba secretos antiguos.", reason: "Aislamiento, locura y horrores en la nieve.", category: "Terror & Suspenso" },
      { id: "b_22", title: "It (Eso)", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["oscuro"], genre: "misterio", protagonist: "amigos", format: ["largo"], passage: "Bienvenido a Derry. Aquí los sueños infantiles a veces aterrorizan.", reason: "Monumental historia sobre la amistad y los miedos profundos.", category: "Terror & Suspenso" },
      { id: "b_23", title: "Misery", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["misterioso", "oscuro"], genre: "misterio", protagonist: "solitario", format: ["medio"], passage: "El coche estaba destrozado y la mujer era su mayor admiradora.", reason: "Thriller claustrofóbico sobre la obsesión creativa.", category: "Terror & Suspenso" },
      { id: "b_24", title: "Apocalipsis", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["oscuro"], genre: "scifi", protagonist: "amigos", format: ["largo"], passage: "El virus se extendió con la velocidad del fuego en verano.", reason: "Una de las cumbres de la supervivencia postapocalíptica.", category: "Terror & Suspenso" },
      { id: "b_25", title: "Cementerio de animales", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["oscuro"], genre: "misterio", protagonist: "solitario", format: ["largo"], passage: "A veces, estar muerto es mejor.", reason: "Exploración oscura del dolor y los límites de la muerte.", category: "Terror & Suspenso" },
      { id: "b_26", title: "El visitante", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["misterioso"], genre: "misterio", protagonist: "solitario", format: ["largo"], passage: "Las huellas dactilares no dejaban lugar a dudas, pero el sospechoso estaba en dos sitios a la vez.", reason: "Suspenso policial con tintes sobrenaturales.", category: "Terror & Suspenso" },
      { id: "b_27", title: "Doctor Sueño", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["misterioso"], genre: "misterio", protagonist: "solitario", format: ["largo"], passage: "Dan Torrance llevaba décadas arrastrando los fantasmas de Overlook.", reason: "Secuela madura y atrapante sobre el poder del resplandor.", category: "Terror & Suspenso" },
      { id: "b_28", title: "Cujo", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["oscuro"], genre: "misterio", protagonist: "solitario", format: ["medio"], passage: "El calor del verano en Castle Rock parecía derretir las esperanzas.", reason: "Tensión extrema en un vehículo averiado bajo el sol.", category: "Terror & Suspenso" },
      { id: "b_29", title: "La milla verde", author: "Stephen King", ages: ["18+"], pace: ["avido"], vibe: ["reflexivo"], genre: "leyendas", protagonist: "solitario", format: ["largo"], passage: "Estábamos en el bloque E de la prisión de Cold Mountain.", reason: "Emoción pura, milagros y drama carcelario inolvidable.", category: "Terror & Suspenso" },

      // --- FRANZ KAFKA (Estrictamente Adultos 18+) ---
      { id: "b_30", title: "La metamorfosis", author: "Franz Kafka", ages: ["18+"], pace: ["casual"], vibe: ["reflexivo", "misterioso"], genre: "scifi", protagonist: "solitario", format: ["corto"], passage: "Al despertar Gregorio Samsa una mañana, se encontró transformado en insecto.", reason: "Metáfora imborrable sobre el aislamiento y la familia.", category: "Clásico Universal" },
      { id: "b_31", title: "El proceso", author: "Franz Kafka", ages: ["18+"], pace: ["avido"], vibe: ["misterioso", "reflexivo"], genre: "misterio", protagonist: "solitario", format: ["medio"], passage: "Alguien debió de haber calumniado a Josef K., pues fue detenido.", reason: "El laberinto kafkiano sobre la burocracia y la culpa.", category: "Clásico Universal" },
      { id: "b_32", title: "El castillo", author: "Franz Kafka", ages: ["18+"], pace: ["avido"], vibe: ["reflexivo"], genre: "leyendas", protagonist: "solitario", format: ["largo"], passage: "Era ya tarde cuando K. llegó al pueblo. La nieve lo cubría todo.", reason: "La lucha inalcanzable de un agrimensor contra un sistema.", category: "Clásico Universal" },
      { id: "b_33", title: "Carta al padre", author: "Franz Kafka", ages: ["18+"], pace: ["casual"], vibe: ["reflexivo"], genre: "crecimiento", protagonist: "solitario", format: ["corto"], passage: "Querido padre: Me preguntaste hace poco por qué afirmaba tenerte miedo.", reason: "Intenso desgarrón psicológico y autobiográfico.", category: "Clásico Universal" },

      // --- DAN BROWN (Estrictamente Adultos 18+) ---
      { id: "b_34", title: "El código Da Vinci", author: "Dan Brown", ages: ["18+"], pace: ["casual", "avido"], vibe: ["misterioso", "aventurero"], genre: "misterio", protagonist: "amigos", format: ["medio", "largo"], passage: "El museo del Louvre era tan silencioso a medianoche...", reason: "Thriller vertiginoso repleto de criptografía y arte.", category: "Suspenso Internacional" },

      { id: "b_97", title: "La llamada de lo salvaje", author: "Jack London", ages: ["12-17", "18+"], pace: ["principiante", "casual"], vibe: ["aventurero"], genre: "aventura", protagonist: "criaturas", format: ["corto", "medio"], passage: "Buck no leía los periódicos, por lo que no se enteraba...", reason: "Aventura indómita en los helados parajes del Klondike.", category: "Clásico Universal" },
      { id: "b_98", title: "Colmillo Blanco", author: "Jack London", ages: ["12-17", "18+"], pace: ["casual"], vibe: ["aventurero"], genre: "aventura", protagonist: "criaturas", format: ["medio"], passage: "Darkness reigned over the frozen waste... La oscuridad reinaba.", reason: "El fascinante paso de la salvaje naturaleza al afecto humano.", category: "Clásico Universal" },
      { id: "b_99", title: "La isla del tesoro", author: "Robert Louis Stevenson", ages: ["5-11", "12-17"], pace: ["casual", "avido"], vibe: ["aventurero"], genre: "aventura", protagonist: "solitario", format: ["medio"], passage: "El viejo marinero de la gabán marrón llegó arrastrando su cofre.", reason: "La novela de piratas, mapas y ambición por excelencia.", category: "Clásico Universal" },
      { id: "b_100", title: "Drácula", author: "Bram Stoker", ages: ["12-17", "18+"], pace: ["casual", "avido"], vibe: ["oscuro", "misterioso"], genre: "misterio", protagonist: "amigos", format: ["largo"], passage: "3 de mayo. Bistritz. —Dejé Munich a las 8:35 del 1 de mayo.", reason: "El mito definitivo del vampiro narrado mediante diarios y cartas.", category: "Clásico Universal" }
    ];

    let currentStep = 0;
    const userAnswers = {};
    let rankedRecommendations = [];
    let currentRecIndex = 0;

    const surveyQuestions = [
      {
        key: "age",
        title: "¿En qué rango de edad te encuentras?",
        options: [
          { icon: "🌱", label: "De 5 a 11 años (Primeras lecturas)", value: "5-11" },
          { icon: "⚡", label: "De 12 a 17 años (Jóvenes)", value: "12-17" },
          { icon: "☕", label: "18 años o más (Jóvenes y adultos)", value: "18+" }
        ]
      },
      {
        key: "pace",
        title: "¿Cuál es tu ritmo de lectura habitual?",
        options: [
          { icon: "🐢", label: "Apenas empiezo / Me canso rápido", value: "principiante" },
          { icon: "🚶", label: "Lector casual (historias ágiles y entretenidas)", value: "casual" },
          { icon: "🚀", label: "Devorador de libros (tramas densas o complejas)", value: "avido" }
        ]
      },
      {
        key: "vibe",
        title: "¿Qué sensación buscas sentir hoy?",
        options: [
          { icon: "🔥", label: "Adrenalina, tensión y aventura trepidante", value: "aventurero" },
          { icon: "🧩", label: "Intriga, secretos y ganas de resolver algo", value: "misterioso" },
          { icon: "💡", label: "Reflexión profunda, filosofía o inspiración", value: "reflexivo" },
          { icon: "🎭", label: "Risas, buen humor o drama cotidiano", value: "divertido" }
        ]
      },
      {
        key: "genre",
        title: "¿Qué tipo de género literario prefieres explorar?",
        options: [
          { icon: "⚔️", label: "Aventura o Fantasía con magia y nuevos mundos", value: "fantasia" },
          { icon: "🕵️", label: "Misterio policial, enigmas y suspenso", value: "misterio" },
          { icon: "🤖", label: "Ciencia ficción, futuros extraños y distopías", value: "scifi" },
          { icon: "📜", label: "Historias reales, leyendas o realismo mágico", value: "leyendas" },
          { icon: "🌱", label: "Vida cotidiana, humor o desarrollo personal", value: "crecimiento" }
        ]
      },
      {
        key: "protagonist",
        title: "¿Quién te gustaría que sea el protagonista?",
        options: [
          { icon: "🛡️", label: "Un héroe solitario contra el mundo o su destino", value: "solitario" },
          { icon: "🤝", label: "Un grupo leal de amigos o una familia unida", value: "amigos" },
          { icon: "🐉", label: "Criaturas míticas, animales o seres fantásticos", value: "criaturas" }
        ]
      },
      {
        key: "format",
        title: "¿Qué extensión prefieres para este momento?",
        options: [
          { icon: "⚡", label: "Corto y al grano (menos de 150 páginas / cuentos)", value: "corto" },
          { icon: "📖", label: "Longitud media (la medida ideal para disfrutar)", value: "medio" },
          { icon: "📚", label: "Novela extensa o saga con un mundo enorme", value: "largo" }
        ]
      }
    ];

    function renderQuestion() {
      const q = surveyQuestions[currentStep];
      document.getElementById("questionTitle").textContent = q.title;

      const progressPercent = Math.round(((currentStep + 1) / surveyQuestions.length) * 100);
      document.getElementById("progressFill").style.width = progressPercent + "%";
      document.getElementById("stepIndicator").textContent = `Pregunta ${currentStep + 1} de ${surveyQuestions.length}`;
      document.getElementById("stepPercent").textContent = progressPercent + "%";

      const list = document.getElementById("optionsList");
      list.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-choice";
        btn.innerHTML = `<span class="opt-icon">${opt.icon}</span> <span>${opt.label}</span>`;
        btn.onclick = () => selectOption(q.key, opt.value);
        list.appendChild(btn);
      });
    }

    function selectOption(key, val) {
      userAnswers[key] = val;
      currentStep++;

      if (currentStep < surveyQuestions.length) {
        renderQuestion();
      } else {
        calculateRecommendations();
      }
    }

    function calculateRecommendations() {
      // Filtro estricto de edad para que Stephen King y otros adultos jamás aparezcan a niños
      const catalogFiltrado = booksCatalog.filter(b => {
        if (!b.ages) return true;
        return b.ages.includes(userAnswers.age);
      });

      rankedRecommendations = catalogFiltrado.map(b => {
        let score = 0;
        if (b.pace && b.pace.includes(userAnswers.pace)) score += 3;
        if (b.vibe && b.vibe.includes(userAnswers.vibe)) score += 3;
        if (b.genre === userAnswers.genre) score += 4;
        if (b.protagonist === userAnswers.protagonist) score += 2;
        if (b.format && b.format.includes(userAnswers.format)) score += 2;

        return { ...b, matchScore: score };
      });

      rankedRecommendations.sort((a, b) => b.matchScore - a.matchScore);
      
      if (rankedRecommendations.length === 0) {
        rankedRecommendations = booksCatalog.filter(b => b.ages.includes("18+"));
      }

      rankedRecommendations = rankedRecommendations.slice(0, 20);

      currentRecIndex = 0;
      document.getElementById("quizBox").style.display = "none";
      document.getElementById("progressWrapper").style.display = "none";
      document.getElementById("resultBox").style.display = "block";

      displayCurrentRecommendation();
    }

    function displayCurrentRecommendation() {
      const book = rankedRecommendations[currentRecIndex];

      document.getElementById("resCategory").textContent = book.category || "Literatura Recomendada";
      document.getElementById("resCounter").textContent = `Opción ${currentRecIndex + 1} de ${rankedRecommendations.length}`;
      document.getElementById("resTitle").textContent = book.title;
      
      let autorMostrado = book.author || "";
      if (autorMostrado.includes("Jesús Ramírez") || autorMostrado.includes("Jesús de Jesús")) {
        autorMostrado = "Robert Pacheco";
      }
      document.getElementById("resAuthor").textContent = `por ${autorMostrado}`;
      
      document.getElementById("resPassage").textContent = `"${book.passage || 'Una obra indispensable.'}"`;
      document.getElementById("resReason").textContent = book.reason || "Coincide con tus preferencias.";
      
      let tituloLimpio = book.title.split('/')[0].replace(/\(Ed\..*?\)/g, '').trim();
      const querySearch = encodeURIComponent(`${tituloLimpio} ${autorMostrado}`);
      document.getElementById("resLink").href = `https://play.google.com/store/search?q=${querySearch}&c=books`;

      const btnNext = document.getElementById("btnNextOption");
      if (currentRecIndex >= rankedRecommendations.length - 1) {
        btnNext.textContent = "🔄 Volver a la primera recomendación";
      } else {
        btnNext.textContent = "🔄 No me convence, ver otra opción";
      }
    }

    function showNextOption() {
      currentRecIndex = (currentRecIndex + 1) % rankedRecommendations.length;
      displayCurrentRecommendation();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartQuiz() {
      currentStep = 0;
      currentRecIndex = 0;
      for (let k in userAnswers) delete userAnswers[k];
      rankedRecommendations = [];

      document.getElementById("quizBox").style.display = "block";
      document.getElementById("progressWrapper").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      renderQuestion();
    }

    document.getElementById("progressWrapper").style.display = "block";
    renderQuestion();
  </script>
</body>
</html>
